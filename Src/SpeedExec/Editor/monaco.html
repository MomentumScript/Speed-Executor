

<!DOCTYPE html>
<html lang="en">
<head>
    <style>
html, body {
    margin: 0;
    padding: 0;
    background-color: transparent;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100%;
}

#main-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
    background-color: #00000000;
}

#tab-bar {
    background: #00000000;
    height: 42px;
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    overflow-x: auto;
    font-family: 'Segoe UI', sans-serif;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

/*i feel like it looks nicer without borders and since its inspired by cloudy i will comment them out*/
.tab {
    height: 32px;
    padding: 0 12px;
    background: #00000000;
    color: #aaa;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    flex-direction: row;
    align-items: center;
    /*border-radius: 8px;*/
    border-radius: 5px;
    position: relative;
    transition: all 0.2s ease, box-shadow 0.2s ease;
    min-width: 100px;
    max-width: 130px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    gap: 8px;
    /*border: 1px solid rgba(255,255,255,0.2);*/
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

.tab:hover {
    background: rgb(40, 40, 40);
    /*border: 1px solid rgba(255,255,255,0.25);*/
    color: #ddd;
}

.tab.active {
    background: rgb(45, 45, 45);
    color: #fff;
    /*border: 1px solid rgba(255, 255, 255, 0.35);*/
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    z-index: 1;
}

.tab.inactive {
    opacity: 0.8;
    background: rgb(35, 35, 35);
}

.tab-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
}

.tab-close {
    margin-left: 6px;
    color: #777;
    font-size: 14px;
    line-height: 0;
    opacity: 0.6;
    transition: all 0.2s ease;
}

.tab:hover .tab-close {
    color: #fff;
    opacity: 1;
    transform: scale(1.1);
}

.luau-icon {
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  display: block;
  margin-right: 6px;
  opacity: 0.9;
}
.tab:hover .luau-icon { filter: brightness(1.15); }
.tab.active .luau-icon { filter: brightness(1.25) drop-shadow(0 0 2px rgba(255,255,255,0.35)); }

#new-tab-btn {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255,255,255,0.5);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-left: auto;
    order: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

#new-tab-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.4);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
}

.tab-enter {
    animation: tabEnter 0.25s ease-out forwards;
}

.tab-exit {
    animation: tabExit 0.25s ease-in forwards;
}

@keyframes tabEnter {
    from {
        transform: translateY(8px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes tabExit {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(-20px);
        opacity: 0;
    }
}

#container {
    flex-grow: 1;
    width: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    background-color: #00000000;
}

.editor-transition-out {
    opacity: 0;
    transition: opacity 0.2s ease-out;
}

.editor-transition-in {
    opacity: 1;
    transition: opacity 0.2s ease-in;
}

.monaco-editor, .monaco-editor-background {
    background-color: #00000000 !important;
}

.monaco-editor .margin {
    background-color: #00000000 !important;
}

    <script src="vs/loader.js"></script>
    <script>
        let tabs = [];
        let activeTab = null;
        let Proposals = [];
        
        class Tab {
            constructor() {
                this.id = `tab-${Date.now()}`;
                this.name = `script_${tabs.length + 1}.lua`;
                this.content = "--Welcome to SpeedExecutor\nprint(\"Welcome\")\n";
                this.element = this.createTabElement();
            }
            
createTabElement() {
  const tab = document.createElement('div');
  tab.className = 'tab tab-enter inactive';

  const iconSvg = `
    <svg class="luau-icon" viewBox="0 0 24 24" aria-hidden="true">
<defs>
  
  <linearGradient id="luauGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="50%" stop-color="#ffffff"/>
    <stop offset="50%" stop-color="gray"/> 
  </linearGradient>
  <mask id="luauMoonCut">
    <rect width="24" height="24" fill="white"/>
    <circle cx="16.5" cy="7.5" r="4.5" fill="gray"/>
  </mask>
</defs>
      <circle cx="12" cy="12" r="10" fill="url(#luauGrad)" mask="url(#luauMoonCut)"/>
    </svg>
  `;

  tab.innerHTML = `
    ${iconSvg}
    <div class="tab-name">${this.name}</div>
    <span class="tab-close">Ã—</span>
  `;

  setTimeout(() => tab.classList.remove('tab-enter'), 300);

  tab.onclick = (e) => {
    if (!e.target.classList.contains('tab-close')) {
      this.activate();
    }
  };

  tab.oncontextmenu = (e) => {
    e.preventDefault();
    e.stopPropagation();
    showTabContextMenu(e.clientX, e.clientY, this);
  };

  const nameEl = tab.querySelector('.tab-name');
  if (nameEl) {
    nameEl.ondblclick = (e) => {
      e.stopPropagation();
      promptRenameTab(this);
    };
  }

  tab.querySelector('.tab-close').onclick = (e) => {
    e.stopPropagation();
    this.close();
  };

  return tab;
}
            
            activate() {
                if (activeTab) {
                    activeTab.element.classList.remove('active');
                    activeTab.element.classList.add('inactive');
                    activeTab.content = editor.getValue();
                }
                
                activeTab = this;
                this.element.classList.remove('inactive');
                this.element.classList.add('active');
                
                const editorContainer = document.getElementById('container');
                editorContainer.classList.add('editor-transition-out');
                
                setTimeout(() => {
                    editor.setValue(this.content);
                    editorContainer.classList.remove('editor-transition-out');
                    editorContainer.classList.add('editor-transition-in');
                    
                    setTimeout(() => {
                        editorContainer.classList.remove('editor-transition-in');
                    }, 200);
                }, 200);

                pushActiveTab();
            }
            
            close() {
                if (tabs.length <= 1) return;
                
                this.element.classList.add('tab-exit');
                
                setTimeout(() => {
                    const index = tabs.indexOf(this);
                    tabs.splice(index, 1);
                    this.element.remove();
                    
                    if (this === activeTab) {
                        const nextTab = tabs[Math.max(0, index - 1)];
                        nextTab.activate();
                    }
                }, 300);
            }
        }
        
        function createNewTab() {
            const tab = new Tab();
            tabs.push(tab);
            const tabBar = document.getElementById('tab-bar');
            tabBar.insertBefore(tab.element, document.getElementById('new-tab-btn'));
            tab.activate();
        }

        function getValue() {
            if (activeTab) {
                activeTab.content = editor.getValue();
                return activeTab.content;
            }
            return "";
        }

        // ---------- host bridge ----------
        // The C# side subscribes to these so it always knows which script tab
        // is in front (auto execute locks onto a named script).
        function postHost(obj) {
            try {
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage)
                    window.chrome.webview.postMessage(JSON.stringify(obj));
            } catch (e) { }
        }

        function pushActiveTab() {
            postHost({
                type: 'tab',
                name: activeTab ? activeTab.name : '',
                count: tabs.length,
                dirty: false
            });
        }

        function tabByName(name) {
            for (let i = 0; i < tabs.length; i++)
                if (tabs[i].name === name) return tabs[i];
            return null;
        }

        let selectedContextMenuTab = null;

        function showTabContextMenu(x, y, tabObj) {
            selectedContextMenuTab = tabObj;
            const menu = document.getElementById('tab-context-menu');
            if (!menu) return;
            menu.style.left = Math.min(x, window.innerWidth - 130) + 'px';
            menu.style.top = Math.min(y, window.innerHeight - 80) + 'px';
            menu.style.display = 'block';
        }

        function hideTabContextMenu() {
            const menu = document.getElementById('tab-context-menu');
            if (menu) menu.style.display = 'none';
            selectedContextMenuTab = null;
        }

        document.addEventListener('click', hideTabContextMenu);
        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.tab')) {
                hideTabContextMenu();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const ctxRenameBtn = document.getElementById('ctx-rename');
            if (ctxRenameBtn) {
                ctxRenameBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedContextMenuTab) {
                        promptRenameTab(selectedContextMenuTab);
                    }
                    hideTabContextMenu();
                };
            }
        });

        function promptRenameTab(tabObj) {
            if (!tabObj) return;
            const newName = prompt("Rename script tab:", tabObj.name);
            if (newName !== null && newName.trim() !== "") {
                tabObj.name = newName.trim();
                const label = tabObj.element.querySelector('.tab-name');
                if (label) label.textContent = tabObj.name;
                pushActiveTab();
            }
        }

        // setValue / getValue drive the *active* tab (header toolbar + execute).
        window.setValue = function (value) {
            value = value == null ? "" : String(value);
            if (activeTab) activeTab.content = value;
            editor.setValue(value);
        };

        window.getValue = getValue;
        window.getActiveTabName = function () { return activeTab ? activeTab.name : ""; };
        window.getTabNames = function () { return tabs.map(t => t.name); };
        window.newTab = function () { createNewTab(); return activeTab ? activeTab.name : ""; };

        // Open (or re-focus) a named tab, used by the file list.
        window.openFileTab = function (name, content) {
            content = content == null ? "" : String(content);
            let existing = tabByName(name);
            if (existing) {
                existing.content = content;
                if (existing === activeTab) editor.setValue(content);
                else existing.activate();
                return name;
            }
            const tab = new Tab();
            tab.name = name;
            tab.content = content;
            tabs.push(tab);
            document.getElementById('tab-bar').insertBefore(tab.element, document.getElementById('new-tab-btn'));
            const label = tab.element.querySelector('.tab-name');
            if (label) label.textContent = name;
            tab.activate();
            return name;
        };

        window.renameActiveTab = function (name) {
            if (!activeTab || !name) return;
            activeTab.name = name;
            const label = activeTab.element.querySelector('.tab-name');
            if (label) label.textContent = name;
            pushActiveTab();
        };

        window.setEditorTheme = function (fontSize) {
            if (fontSize) editor.updateOptions({ fontSize: fontSize });
        };

        // Multi-tab persistence: the host snapshots every open tab on exit and
        // rebuilds them on the next launch.
        window.exportTabs = function () {
            if (activeTab) activeTab.content = editor.getValue();
            return tabs.map(function (t) { return { name: t.name, content: t.content }; });
        };

        window.getActiveTabIndex = function () { return tabs.indexOf(activeTab); };

        window.openTabs = function (list, active) {
            if (!list || !list.length) return;
            for (let i = 0; i < list.length; i++) {
                const item = list[i] || {};
                window.openFileTab(item.name || ("script_" + (i + 1) + ".lua"), item.content || "");
            }
            const idx = (typeof active === 'number' && active >= 0 && active < tabs.length) ? active : 0;
            const target = tabs[idx] || tabs[0];
            if (target) target.activate();
        };

        window.restoreActiveView = function (cursor, scroll) {
            try {
                if (cursor > 0) editor.setPosition(editor.getModel().getPositionAt(cursor));
                if (scroll > 0) editor.setScrollTop(scroll);
            } catch (e) { }
        };

                const lineContent = model.getLineContent(position.lineNumber);

                const prevChar = position.column > 1 ? lineContent.charAt(position.column - 2) : '';

                // only handle auto-pairing when nothing is selected

                    const pairs = {
                        '(': ')',
                        '[': ']',
                        '{': '}',
                        '"': '"',
                        "'": "'"
                    };

                    // handle opening pairs

                        // skip if its in a string or comment
                        const word = model.getWordAtPosition(position);
                        const isInString = word && (word.word.startsWith('"') || word.word.startsWith("'"));
                        const isInComment = lineContent.trim().startsWith('--');
                        
                        if (!isInString && !isInComment) {
